<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Netsy — Goalie Scorekeeper</title>
<style>
  :root {
    --bg: #0c1117;
    --panel: #161d26;
    --panel-border: #2a3441;
    --rink-blue: #4a9be0;
    --rink-blue-dark: #10202f;
    --red: #f0555c;
    --green: #3ed191;
    --gray: #7c8896;
    --ink: #e9eef3;
    --ink-dim: #93a2b1;
    --gold: #f0bb52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  .display {
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif;
    letter-spacing: 0.5px;
    font-weight: 400;
  }
  #app {
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 24px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 50% 0%, rgba(74,155,224,0.12), transparent 55%),
      var(--bg);
  }

  .logo-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 0 30px;
  }
  .rink-icon { width: 96px; height: 78px; margin-bottom: 10px; }
  .title { font-size: 62px; line-height: 1; margin: 0; color: var(--ink); }
  .title .puck { color: var(--red); }
  .tagline {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    font-weight: 600;
    margin-top: 8px;
  }

  .menu { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .menu-btn {
    position: relative;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 17px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .menu-btn:active { transform: scale(0.98); }
  .menu-btn.primary {
    background: linear-gradient(135deg, var(--red), #c8383f);
    border-color: transparent;
    color: white;
  }
  .menu-btn.locked { color: var(--ink-dim); }
  .menu-btn.locked .chev { color: var(--ink-dim); }
  .menu-btn .label-row { display: flex; align-items: center; gap: 8px; }
  .pro-pill {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #1a1406;
    background: var(--gold);
    padding: 2px 6px;
    border-radius: 5px;
  }
  .lock-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.8; }
  .chev { font-size: 18px; color: rgba(255,255,255,0.7); }

  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-dim);
    padding-top: 6px;
  }
  .footer a { color: var(--rink-blue); text-decoration: none; cursor: pointer; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal {
    background: var(--panel); width: 100%; max-width: 400px;
    border: 1px solid var(--panel-border); border-radius: 16px; padding: 22px 20px;
  }
  .modal-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(240,187,82,0.15); display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .modal-icon.about { background: rgba(74,155,224,0.15); }
  .modal h2 { font-family: inherit; font-weight: 700; font-size: 19px; margin: 0 0 8px; color: var(--ink); }
  .modal p { font-size: 14px; line-height: 1.5; color: var(--ink-dim); margin: 0 0 6px; }
  .about-list { margin: 12px 0; padding-left: 18px; color: var(--ink-dim); font-size: 13.5px; line-height: 1.7; }
  .about-version { font-size: 11.5px; color: var(--ink-dim); margin-top: 14px; border-top: 1px solid var(--panel-border); padding-top: 10px; }
  .modal-actions { margin-top: 18px; }
  .modal-actions button {
    width: 100%; border: none; border-radius: 8px; padding: 12px 0; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: inherit; background: var(--rink-blue); color: white;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var state = { modal: null }; // null | 'load' | 'stats' | 'about'

  function openModal(name) {
    state.modal = name;
    render();
  }
  function closeModal() {
    state.modal = null;
    render();
  }
  function startNewGame() {
    window.location.href = "netsy.html";
  }

  var rinkIconSvg =
    '<svg class="rink-icon" viewBox="0 0 120 96" fill="none">' +
      /* Net outline with rounded top corners (rx="6", ry="6") */
      '<rect x="14" y="8" width="92" height="52" rx="6" ry="6" fill="none" stroke="#4a5b6d" stroke-width="2" />' +
      /* Red goal posts and crossbar */
      '<rect x="10" y="4" width="6" height="72" fill="#f0555c" />' +
      '<rect x="104" y="4" width="6" height="72" fill="#f0555c" />' +
      '<rect x="10" y="4" width="100" height="6" fill="#f0555c" />' +
      /* Bottom line changed to crease light blue (#41b6e6) */
      '<line x1="4" y1="76" x2="116" y2="76" stroke="#41b6e6" stroke-width="3" opacity="0.85" />' +
    '</svg>';

  var lockIconSvg =
    '<svg class="lock-icon" viewBox="0 0 24 24" fill="none">' +
      '<rect x="5" y="10" width="14" height="10" rx="2" stroke="#93a2b1" stroke-width="1.8" />' +
      '<path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#93a2b1" stroke-width="1.8" fill="none" />' +
    '</svg>';

  function menuButton(opts) {
    var classes = "menu-btn" + (opts.primary ? " primary" : "") + (opts.locked ? " locked" : "");
    var labelRow =
      '<div class="label-row">' +
        (opts.locked ? lockIconSvg : "") +
        '<span>' + opts.label + '</span>' +
        (opts.locked ? '<span class="pro-pill">PRO</span>' : "") +
      '</div>';
    return (
      '<button class="' + classes + '" id="' + opts.id + '">' +
        labelRow +
        '<span class="chev">&rsaquo;</span>' +
      '</button>'
    );
  }

  function modalHtml() {
    if (!state.modal) return "";

    if (state.modal === "load" || state.modal === "stats") {
      var feature = state.modal === "load" ? "Load Game" : "Stats";
      var desc = state.modal === "load"
        ? "Saving and loading past games is a Netsy Pro feature, so you can pick up any game right where you left off."
        : "Season-long stats, trends, and breakdowns across every logged shot are part of Netsy Pro.";
      return (
        '<div class="modal-backdrop" id="modal-backdrop">' +
          '<div class="modal">' +
            '<div class="modal-icon">' + lockIconSvg.replace('width="15" height="15"', 'width="20" height="20"') + '</div>' +
            '<h2 class="display">' + feature + ' is a Pro feature</h2>' +
            '<p>' + desc + '</p>' +
            '<div class="modal-actions"><button id="modal-ok">Got it</button></div>' +
          '</div>' +
        '</div>'
      );
    }

    if (state.modal === "about") {
      return (
        '<div class="modal-backdrop" id="modal-backdrop">' +
          '<div class="modal">' +
            '<div class="modal-icon about">' + rinkIconSvgSmall() + '</div>' +
            '<h2 class="display">About Netsy</h2>' +
            '<p>Netsy is a score and stats keeper built for ice hockey goalies. Log every goal, save, and miss right where it happened on the ice, and keep a running scoreboard and save percentage as the game unfolds.</p>' +
            '<ul class="about-list">' +
              '<li>Tap-to-place shot locations on the net</li>' +
              '<li>Track period, breakaways, and rebounds</li>' +
              '<li>Live scoreboard and save percentage</li>' +
            '</ul>' +
            '<div class="about-version">Netsy v1.0 &mdash; Free Edition</div>' +
            '<div class="modal-actions"><button id="modal-ok">Close</button></div>' +
          '</div>' +
        '</div>'
      );
    }

    return "";
  }

  function rinkIconSvgSmall() {
    return (
      '<svg width="20" height="16" viewBox="0 0 120 96" fill="none">' +
        '<rect x="14" y="8" width="92" height="52" fill="none" stroke="#4a9be0" stroke-width="3" />' +
        '<line x1="4" y1="76" x2="116" y2="76" stroke="#4a9be0" stroke-width="4" opacity="0.85" />' +
      '</svg>'
    );
  }

  function template() {
    return (
      '<div class="logo-wrap">' +
        rinkIconSvg +
        '<h1 class="title display">Netsy<span class="puck">.</span></h1>' +
        '<div class="tagline">Goalie Scorekeeper</div>' +
      '</div>' +
      '<div class="menu">' +
        menuButton({ id: "btn-new", label: "New Game", primary: true }) +
        menuButton({ id: "btn-load", label: "Load Game", locked: true }) +
        menuButton({ id: "btn-stats", label: "Stats", locked: true }) +
        menuButton({ id: "btn-about", label: "About" }) +
      '</div>' +
      '<div class="footer">Netsy v1.0</div>' +
      modalHtml()
    );
  }

  function attachEvents() {
    var btnNew = document.getElementById("btn-new");
    var btnLoad = document.getElementById("btn-load");
    var btnStats = document.getElementById("btn-stats");
    var btnAbout = document.getElementById("btn-about");
    if (btnNew) btnNew.onclick = startNewGame;
    if (btnLoad) btnLoad.onclick = function () { openModal("load"); };
    if (btnStats) btnStats.onclick = function () { openModal("stats"); };
    if (btnAbout) btnAbout.onclick = function () { openModal("about"); };

    var backdrop = document.getElementById("modal-backdrop");
    if (backdrop) {
      backdrop.onclick = function (e) {
        if (e.target === backdrop) closeModal();
      };
    }
    var modalOk = document.getElementById("modal-ok");
    if (modalOk) modalOk.onclick = closeModal;
  }

  function render() {
    var root = document.getElementById("app");
    root.innerHTML = template();
    attachEvents();
  }

  render();
})();
</script>
</body>
</html>
