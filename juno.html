<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book of Juno</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<script> // functions
  // js functions
const SAVE_KEY = "junoJournalSave";

let currentScene = "s1";
let path = {};
let reaction = null;
let pendingScene = null;
let history = [];

function render() {
    if("speechSynthesis" in window){
          window.speechSynthesis.cancel();
          if(typeof playBtn !== "undefined")
              playBtn.textContent = "▶ Play Aloud";
      }
    const scene = SCENES[currentScene];
    renderSymbols();
    chapter.textContent = reaction
        ? reaction.title || "The Ink Settles"
        : scene.title;
    renderStory(scene);
    renderChoices(scene);
    backBtn.style.display = history.length > 0 ? "inline-block" : "none";
    saveGame();
}

function renderStory(scene){
    story.innerHTML = "";
    const paragraphs = reaction
        ? reaction.text
        : resolve(scene.entries);
    paragraphs.forEach(text=>{
        const p = document.createElement("p");
        p.textContent = text;
        if(story.children.length===0)
            p.classList.add("opening");
        story.appendChild(p);
    });
}


function renderChoices(scene){
    choices.innerHTML="";
    if(reaction){
        const button=document.createElement("button");
        button.textContent="Turn the Page";
        button.onclick=nextScene;
        choices.appendChild(button);
        return;
    }
    const list=resolve(scene.choices);
    list.forEach(choice=>{
        const button=document.createElement("button");
        button.className="choice";
        button.textContent=choice.label;
        button.onclick=()=>selectChoice(choice);
        choices.appendChild(button);
    });
}

function selectChoice(choice){
    history.push({ scene: currentScene, path: { ...path } });  
    Object.assign(path, choice.flag);
    // Skip reaction pages
    if(true){
        currentScene = resolve(choice.next);
        reaction = null;
        pendingScene = null;
        render();
        return;
    }
    reaction = {
        title: choice.reactionTitle,
        text: Array.isArray(resolve(choice.reaction))
            ? resolve(choice.reaction)
            : [resolve(choice.reaction)]
    };
    pendingScene = resolve(choice.next);
    render();
}

function nextScene(){
    currentScene=pendingScene;
    reaction=null;
    pendingScene=null;
    render();

}

function goBack(){
    if(history.length === 0)
        return;
    const prev = history.pop();
    currentScene = prev.scene;
    path = { ...prev.path }; 
    reaction = null;
    pendingScene = null;
    render();

}

function restartJournal(){
    localStorage.removeItem("junoJournalSave");
    currentScene="s1";
    path={};
    reaction=null;
    pendingScene=null;
    history = [];
    saveGame();
    render();
}

function saveGame(){
    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({
            scene:currentScene,
            path:path,
            reaction:reaction,
            pending:pendingScene,
            history:history
        })
    );
}

function loadGame(){
    const save=localStorage.getItem(SAVE_KEY);
    if(!save)
        return;

    const data=JSON.parse(save);
    currentScene=data.scene;
    path=data.path;
    reaction=data.reaction;
    pendingScene=data.pending;
    history=data.history||[];

}

function resolve(value){
    if(typeof value==="function")
        return value(path);
    return value;

}

function renderSymbols(){
    symbols.innerHTML = "";
    const icons = [];
      // 1 mountain or fire
      // 3 zinnia
      // 5 heart, fist, skull
      // 6 raven, sword, or shield
      // 9-1 seven pointed star
      // 10-2 sunflower
      // 10-3 Gabriel crescent moon
      // 10-5 dorian gear
      // 10-4 Saberic sunrise
      // 10-6 Jaksyn music note
      // 10-7 leaf
      // 10-8 blood drip
      // 12 masquerade mask
      // 13-2 wolf

    if(path.s1_1)
        icons.push("./images/mountain.png");
    if(path.s1_2)
        icons.push("./images/fire.png");

    if(path.s3_1 || path.s3_2 || path.s3_3)
        icons.push("./images/zinnia.png");

    if(path.s5_1)
        icons.push("./images/heart.png");
    if(path.s5_2)
        icons.push("./images/fist.png");
    if(path.s5_3)
        icons.push("./images/skull.png");

    if(path.s6_1)
        icons.push("./images/raven.png");
    if(path.s6_2)
        icons.push("./images/sword.png");
    if(path.s6_3)
        icons.push("./images/shield.png");

    if(path.s9_1)
        icons.push("./images/7star.png");

    if(path.s10_1)
        icons.push("./images/solo.png");
    if(path.s10_2)
        icons.push("./images/sunflower.png");
    if(path.s10_3)
        icons.push("./images/moon.png");
    if(path.s10_4)
        icons.push("./images/sunrise.png");
    if(path.s10_5)
        icons.push("./images/gear.png");
    if(path.s10_6)
        icons.push("./images/note.png");
    if(path.s10_7)
        icons.push("./images/leaf.png");
    if(path.s10_8)
        icons.push("./images/blood.png");

    if(path.s12)
        icons.push("./images/mask.png");

    if(path.s13_2)
        icons.push("./images/wolf.png");

    // Draw them
    icons.forEach(src=>{
        const img=document.createElement("img");
        img.src=src;
        img.alt="";
        symbols.appendChild(img);
    });
}

function speakStory(){
    if(!("speechSynthesis" in window)){
        alert("Sorry, your browser doesn't support read-aloud.");
        return;
    }
    window.speechSynthesis.cancel();
    const paragraphs = Array.from(story.querySelectorAll("p")).map(p => p.textContent);
    const text = paragraphs.join(". ");
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.95;
    utterance.onend = () => { playBtn.textContent = "▶ Play Aloud"; };
    utterance.onerror = () => { playBtn.textContent = "▶ Play Aloud"; };
    window.speechSynthesis.speak(utterance);
    playBtn.textContent = "⏸ Stop Reading";

}

function togglePlayAloud(){
    if(window.speechSynthesis.speaking){
        window.speechSynthesis.cancel();
        playBtn.textContent = "▶ Play Aloud";
        return;
    }
    speakStory();

}

</script>

            );

        }

        #chapter{

        }

        /* ---------- Story ---------- */

        #story{

        }

  s7: {
    title: "Chapter 7: The Call",
    entries: [
      "Work has become predictable. Not easy—never easy—but familiar. There is always another frightened village. Another bully who mistakes fear for strength. Another family desperate enough to beg a stranger for help. ",
      "A few days ago I tracked down a young woman who had been kidnapped by a fringe cult hoping to swell its ranks. By the time I found her, they had nearly brainwashed her, until I broke them. Her mother couldn't afford a proper reward. She apologized more times than I could count before offering me a warm bed, a few home-cooked meals, and a roof over my head for two nights. It was more than enough. People like her are the reason I keep doing this.",
      "Tonight I found myself in a crowded tavern, letting the warmth chase away the cold while I listened to the conversations around me. Most were nothing more than drunken boasts and idle gossip... until one rumor made the room seem quieter than it really was. The Church of the Crimson Sun. Their name drifted across the room from a table of weary travelers. They spoke of Withermarsh—of disappearances, strange chants, and midnight fires. They said the church had begun planting roots there. I knew the Crimson Sun and what followed them all too well. Corruption. Fear. ", 
      "I stared into my cup long after the travelers had moved on. If I ride again tomorrow, I could make it there. Maybe I could make a difference. Maybe this town can still be saved… Or maybe it's already too late. ",
    ],

  s8: {
    title: "Chapter 8: Heaven and Horror",
    entries: (path) => {
      const hammerName = path.s6_3 ? "Justice" : path.s6_1 ? "Vengeance" : null;
      return [
        "The smell of damp earth and rotting leaves hung thick in the night air as I crouched beneath the trees, watching the crumbling hovel through a cracked window.",
        "Inside, half a dozen cultists stood in a circle around a man tied to a wooden post. Flames licked at his bare feet while torches painted the walls in flickering orange light. They chanted in low, rhythmic voices. I couldn't understand the words, but I didn't need to. I'd seen enough sacrifices to know one when I saw it. ",
        "The Church of the Crimson Sun had grown bolder with every passing month. Under Bishop Glavius, their corruption spread like a plague, swallowing villages before anyone found the courage to stand against them. Withermarsh was next.",
        "Not if I could help it. I tightened my grip on my shield and waited for the right moment.",
        "Then I heard voices. Boots crunched along the path to my right. I glanced over my shoulder and counted seven men shambling toward the hovel. Perfect. Seven oafs stomping through the woods with all the subtlety of a drunken bear. Did they even know each other? I slipped farther left through the brush, hoping to keep my advantage before they blundered into the ritual and ruined everything. ",
        "No more waiting. I burst through a collapsed section of the wall before anyone else could announce our arrival. Two cultists turned toward me. Too slow.",
        hammerName
          ? `My hammer, ${hammerName}, found my right hand. My wooden shield settled comfortably on my left arm.`
          : "My hammer found my right hand. My wooden shield settled comfortably on my left arm.",
        "The seven strangers poured in from the opposite side of the hovel. Several still wore the crimson robes of the church with weapons hidden beneath them.",
        "One of the newcomers threw off his crimson robe. He was enormous — long brown hair, furs, an accordion across his back, a club nearly as large as I was.",
        "He dropped to one knee. \"Oh! What beauty has come from dark wilderness! THE HEAVENS! She take my heart!\" ",
        "I stared at him. Behind him, a few of the others burst into laughter. I blew a loose strand of ruby-red hair out of my face. What kind of man declares his love in the middle of a fight? Apparently this one. ",
        "The battle raged on around us. Knives flew. Most missed. Someone started hurling pebbles. Those missed too. ",
        "A towering knight, I later learned is Sir Saberic, in full plate armor pushed through the melee and placed both hands on the bound victim. Golden light poured from his palms, keeping the man alive.",
        "The rest of us cut through the remaining cultists one by one. The bare-chested lunatic finally reached the old priest leading the ritual. With a roar, he brought his club crashing down. The cultist folded to the floor like an accordion of snapping bones. Silence. The chanting stopped. The ritual was over. The giant barbarian grinned and marched straight toward me.",
        "\"I'm Dion Dreadbell,\" he said proudly. \"My heart beats like a thousand war drums for you.\"",
        "I looked down at my hammer, then back at him. \"I like you less than my hammer does,\" I said. \"And it hates you.\"",
        "A tan half-elf with a runic prosthetic arm, Dorian, stepped between us. \"We're on the same side here. Is anyone hurt?\" He said calmly.",
        "As everyone caught their breath, introductions became slightly less ridiculous. It turned out Captain Elias Vayne and old Rewin had sent all of us here separately to investigate the disappearances. So we were on the same side. That didn't mean I trusted them. Judging by the sideways glances passing between the others, they didn't entirely trust each other either. They hadn't been together very long. ",
        "We spread through the ruined hovel searching for clues. Cassian, a pale dhampir ina long dark leadther coat rummaged through the bodies, then paused and gulped down a vial of dark red liquid. Disgusting. Leif, a wiry rogue, and Jaksyn, a tiefling bard, found a weathered sheet of parchment with five names scrawled in charcoal. Missing people. More victims.  ",
        "Near the body of the ritual leader lay a strange pendant, a dark orb hanging from a silver chain. Gabriel, a skinny half-elf dressed with more jewelry than armor, picked it up delicately. ",
        "I walked to the victim in the center of the room. Dion followed close behind, watching everything I did. Carefully, I cut the ropes binding him and eased him onto the floor. The poor man trembled violently.",
        " \"It's over,\" I told him. \"You're safe.\" ",
        "He looked straight past me toward the sky. \"Xavier...\" Before anyone could ask what he meant, his entire body turned to stone, then crumbled into dust. ",
        " The dust swirled up towards the sky. Every one of us looked upward. The clouds twisted into a violent spiral overhead. They churned faster... and faster… Until they formed a colossal face stretching across the heavens. Its glowing eyes locked onto us. It's voice thundered across the night. \"YOU HAVE NO IDEA OF WHAT HORRORS AWAIT!\"",
        "There was much deliberation on what it all meant and what was to come, Gabriel even had a vision of this Xavier, a dark lord tearing at the gates of mortality from behind the veil of death. One thing was certain — we would head back to Withermarsh to find Elias. Oh, and there was this barbarian to deal with...",
      ];
    },

  s9_1: {
    title: "Chapter 9-1: Withermarsh",
    entries: [
      "Withermarsh was a town as muddy and unkept as its name implies, forever teetering on the edge of existence, barely more than a trading post in the rural wild of Kjlovania.",
      "We met up with old Rewin and Captain Elias at the Hollow Hearth tavern in Withermarsh. For the next few days we investigated other strange happenings around the area and did a few errands for Elias.",
      "We eventually learned that the wizard Sylvanas was behind several attacks on the trade routes. Enough was enough, and it was time to deal with him.",
      "Elias had us pinned down at the Hollow Hearth, pushing us to deal with his dirty work. He introduced that creepy Hooded Stranger and laid out the plan: meet at first light, storm the Eldritch Tower, and take down Sylvanus. My gut screamed that the whole thing was a setup, and looking at the rest of this ragtag group, I wasn't alone. Leif and I agreed—we were being steered like cattle, and I hated every second of it.",
      "We met in the morning, but Elias didn't show. He left a note instead, \"Went on ahead. Meet you there. -Elias\"",

      "When we arrived at the tower, Sylvanus was waiting in the yard, acting like he was some master manipulator, but we proved him wrong. It was a messy fight, but we finally found our rhythm. Dion landed the killing blow—shouting my name, as if that would make me swoon—and the wizard fell.",
      "Cassian found and pulled Elias's body from the wreckage; the guy was burned to a crisp, the Hooded Stranger too. As I stood there in the silence, watching Dorian burn the bodies, we scavenged what was left. Among the items were a black iron key and a letter to Lord Adrian in Braxia. It was an endorsement, the golden ticket to get us into the city. Whatever Elias was planning, it died with him, but the road led straight to Braxia. That's where we were headed next.",

      "Juno’s Journal ends here.",

  s10: {
    title: "Chapter 10: Braxia",
    entries: [
      "The road wound north through jagged mountain passes until the trees gave way to towering black stone walls. There, beneath a pale crescent moon, stood Braxia. ",
      "I had seen plenty of cities. None of them looked like this. ",
      "Dark spires clawed at the sky. Gargoyles watched from rooftops. Iron lanterns cast just enough light to remind you how much darkness surrounded them. Even the people moved with practiced caution, speaking in hushed voices as though they feared the city itself might overhear. ",
      "We found Elias' home marked by a silver wolf on the door. We knew from a letter and key we found on his body that he was about to send us here. He knew things were escalating, and he trusted us, but perhaps only because there was no one else.  ",
      "The city had eyes everywhere, and we were outsiders. It wasn't long before there was a knock at the door. Lord Adrian, ruler of Braxia, sent his emissary to deliver an invitation to a masked dinner party at his castle later this week. Gabriel and Jaksyn looked delighted at the idea. Leif and I exchanged disapproving glances. He looked nauseous.  ",
      "A folded note fell out of the envelope. ",
      " \"One among you does not belong.\"  ",
      "No signature. No explanation. The handwriting was… wrong, like a tortured mind or something writing with its paws. Great… mind games. ",
      "It was just enough poison to make everyone glance sideways. I watched the others carefully. Eyes lingered a little too long. Whoever left that note didn't need to divide us yet. They only needed to plant a seed of doubt. ",
      "Cassian noticed a woman watching us outside the window. Silver hair. Red leather cloak. She quickly turned down an alley. He dashed after her. We followed. ",
      "She led us through twisting streets and forgotten alleys before slipping inside an abandoned library. Dust covered every shelf. The smell of old paper and copper lingered in the air. ",
      "She stood waiting for us. On either side was a gaping hole into the dark basement beneath.  ",
      " \"My name is Vera Morningstar.\" She spoke with the confidence of someone accustomed to being obeyed. Before any of us could question her, she looked directly at Cassian. ",
      " \"You've gone far too long without knowing who you are.\" The room fell silent. She revealed what none of us expected. Cassian wasn't merely a dhampir. He was a Morningstar. Royal blood. Her cousin. One of the last descendants of a family the Church of the Crimson Sun had spent generations trying to erase. ",
      "It explained why the church hunted him. It explained why so many strange events seemed to orbit our group, and it explained why Vera had risked meeting us. She warned us about Lord Adrian and the politics hidden beneath polished smiles. Lord Adrian remained neutrality in the wars of Kjlovania, but we had to find a way to make him see that the Crimson Sun and Xavier would wipe out Braxia if he did not help us stand against them, and the first strike should be against Azmekal, the demon lord forging an undead army within the vast sewers beneath Braxia.  ",
      "Then she was gone. Cassian left reeling, teetering between disbelief and realization.  ",
      "Braxia only grew stranger as the night continued. Vampire raves thundered from alleys and blood rained behind secret walls.  ",
      "I found myself standing outside, staring toward Lord Adrian's estate high above the city. Tomorrow evening we would dine with nobles. I would have preferred another cult. At least cultists usually tell you they're trying to kill you. ",
      "… and I knew we would likely have to face Azmekal soon. I was prepared to face death and had no fear of it. My hope was that it would be in honor, and worth the sacrifice to bring down the Crimson Sun and it's evil patriarchy. I didn't know how many days I had left, and I considered if maybe I should make the most of the night before it's my last.  ",

  s10_1: {
    title: "Chapter 10-1: Alone",
    entries: ["I awoke well rested, yet I felt apprehensive towards the dress waiting for me. It was beautifully dangerous looking with black lace and lined with a thin layer of hidden armor and hidden pockets. A dinner party was not my preferred battlefield, but something told me mingling with nobles would not be the only battle I faced today."],

  s10_2: {
    title: "Chapter 10-2: Sunflower and Juniper",
    entries: ["Somewhere along the way, Dion had picked up a gift for me. He suddenly remembered it after a nudge from Cassian. He pulled out a handheld mirror of ornate silver. “Dion got Juno a gift,” he said with a bashful smile.  ",
        "I took it cautiously and when I gazed into the mirrored surface, something changed. The image swirled until suddenly I was looking at my sister smiling back at me. It was a memory I had tucked away. Zinnia had a handful of wildflowers and was sitting in the stable with her unending optimism. My eyes watered up and I could no longer speak.  ",
        "I looked up into Dion’s eyes, which were trying to ascertain if he had done a good thing or a bad thing after seeing my tears. All my walls broke down in that moment. I grabbed his arm and led him upstairs.  ",
        "We came downstairs together in the morning. Cassian and Gabriel avoided eye contact. Jaksyn smiled knowingly.  ",
        "I broke the silence, “Don't look at me like that. I was emotionally compromised.”  ",
        "After another awkward moment during breakfast, Dorian asked, “so, Dion, how did it go with Juno last night?” ",
        "Dion responded with a huge smile, “it’s not the going with Juno, it's the coming.” ",
        "Dorian burst into laughter and shook his head."],

    choices: [{ label: "Continue...", flag: {}, next: "s11" }],

  s10_3: {

  s10_4: {

      " “Then don’t, not tonight,“ I said. “No more games, but I am keeping very close eye on you. Maybe soon I can earn your trust.” I stepped inside and shut the door. He stood up, his movements fluid, silent, and he locked the door behind me. He didn't look at me with the usual caution, but with recognition. We were the only two in this house who didn't lie to ourselves. Everyone else was hoping for redemption, for heroes, for magic to fix their broken pieces. Leif and I? We just wanted to survive the next twenty-four hours. ",
